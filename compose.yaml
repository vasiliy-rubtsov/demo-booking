services:
  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/up | grep -q 'Application up'"]
      interval: 2s
      start_period: 300s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/create-testing-db.sql:/docker-entrypoint-initdb.d/create-testing-db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking"]
      interval: 2s
      retries: 15

volumes:
  postgres:
